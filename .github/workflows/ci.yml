# .github/workflows/ci.yml —— MVP spec-first 工作流 CI（G5 三件套 + Spec-Binding + E2E chromium）
#
# 设计：
# - trinity job：typecheck + lint:rules + lint:spec-binding + vitest（58 文件 1272 tests，断言级绿）
# - e2e-local job：Playwright chromium（核心流 + a11y，约 22 tests），依赖 trinity 通过后跑
# - 工作目录：mvp/（package.json 所在地）
# - Node 版本：20.x（与 @types/node ^20 对齐）
name: CI

on:
  push:
    branches: [main, dev, dev-rules, 'trae/agent-*']
  pull_request:
    branches: [main, dev, dev-rules]

jobs:
  trinity:
    name: G5 三件套 + Spec-Binding
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mvp/package-lock.json
      - name: Install deps
        run: npm ci
      - name: typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: lint:rules (13 项规则机器校验)
        run: npm run lint:rules
      - name: lint:spec-binding (Spec↔代码双向绑定校验)
        run: npm run lint:spec-binding
      - name: vitest (单元测试)
        run: npm test

  e2e-local:
    name: E2E chromium
    runs-on: ubuntu-latest
    needs: trinity
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mvp/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: E2E chromium (核心流 + a11y)
        run: npm run test:e2e:local
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mvp/playwright-report
          retention-days: 7
